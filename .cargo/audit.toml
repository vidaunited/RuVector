# cargo-audit configuration for the ruvector workspace.
#
# Ignored advisories MUST have a justification. Anything fixable should be
# fixed via a dependency bump rather than ignored here. Re-evaluate the
# `until` dates periodically.
#
# This list is longer than the one in deny.toml on purpose: cargo-audit
# scans the whole Cargo.lock (optional features included) while
# cargo-deny resolves only the default-feature graph for the targets in
# deny.toml, and every ID below that is absent from deny.toml is one
# cargo-deny never encounters (measured 2026-09-04, cargo-deny 0.20.2).
# Measured against the workspace Cargo.lock the same day (cargo-audit
# 0.22, unfiltered): 17 of the 25 IDs below match; the 8 that do not are
# RUSTSEC-2021-0127, RUSTSEC-2022-0054, RUSTSEC-2024-0388,
# RUSTSEC-2024-0408, RUSTSEC-2026-0097, RUSTSEC-2026-0115,
# RUSTSEC-2026-0116 and RUSTSEC-2026-0117 (RUSTSEC-2026-0097 does
# match the fuzz/ and examples/ lockfiles, which this file does not
# govern). cargo-audit does not warn about unused ignores, so these
# are candidates for removal, not errors.

[advisories]
ignore = [
    # ------------------------------------------------------------------
    # Vulnerabilities (genuinely no upstream fix available)
    # ------------------------------------------------------------------

    # rsa 0.9.x — Marvin Attack (timing sidechannel on RSA decryption).
    # No fixed upgrade is available from upstream `rsa`. We do not expose
    # an RSA decryption oracle: TLS in this workspace runs on rustls with
    # Ed25519/X25519 suites, and `rsa` is pulled only transitively (e.g.
    # SQL drivers, JWT verification paths) where we never decrypt
    # attacker-controlled ciphertexts under a long-lived RSA key.
    # Re-evaluate when the `rsa` crate ships a constant-time implementation.
    "RUSTSEC-2023-0071",

    # ------------------------------------------------------------------
    # "Unmaintained" warnings (informational, not vulnerabilities)
    # ------------------------------------------------------------------
    # These are pulled transitively through deps we do not control. They
    # are not exploitable on their own; they are notices that the upstream
    # crate is no longer accepting patches. We mute them to keep CI clean
    # and revisit when the parent dep migrates.

    "RUSTSEC-2021-0140",  # rusttype — transitive via plotters; pure rendering, no untrusted input
    "RUSTSEC-2021-0127",  # serde_cbor — unmaintained transitive dependency of pgrx; no maintained version satisfies pgrx
    "RUSTSEC-2022-0054",  # wee_alloc — transitive via wasm-bindgen-cli internals
    "RUSTSEC-2024-0370",  # proc-macro-error — build-time only (proc-macro), no runtime exposure
    "RUSTSEC-2024-0380",  # pqcrypto-dilithium — replaced by pqcrypto-mldsa, awaiting parent migration
    "RUSTSEC-2024-0381",  # pqcrypto-kyber — replaced by pqcrypto-mlkem, awaiting parent migration
    "RUSTSEC-2024-0384",  # instant — transitive via parking_lot/older time deps
    "RUSTSEC-2024-0388",  # derivative — transitive proc-macro
    "RUSTSEC-2024-0436",  # paste — transitive proc-macro, build-time only
    "RUSTSEC-2025-0119",  # number_prefix — transitive via indicatif rendering
    "RUSTSEC-2025-0124",  # rand_os — transitive, replaced by getrandom in modern code paths
    # RUSTSEC-2025-0134 (rustls-pemfile 1.x) dropped: the only edge was
    # reqwest 0.11 -> hyper 0.14, removed by the h2 RUSTSEC-2026-0258 fix.
    # The tree now carries rustls-pemfile 2.2.0 only, which is unaffected.
    "RUSTSEC-2025-0141",  # bincode — unmaintained notice; we pin a known-good version

    # Added 2026-08-03. All four carry `patched = []` upstream — there is no
    # version to move to, so these cannot be fixed by a bump.
    "RUSTSEC-2026-0162",  # pqcrypto-traits — PQClean upstream archived; same family as the 2024-0380/0381 entries above
    "RUSTSEC-2026-0163",  # pqcrypto-internals — PQClean upstream archived; transitive with pqcrypto-traits
    "RUSTSEC-2026-0173",  # proc-macro-error2 — build-time proc-macro via validator_derive; no runtime exposure
    "RUSTSEC-2026-0192",  # ttf-parser — transitive via plotters-family rendering; parses only fonts we ship, never untrusted input

    # ------------------------------------------------------------------
    # Vulnerabilities (blocked upstream, no exploit path in our usage)
    # ------------------------------------------------------------------

    # quick-xml 0.26.0 — two DoS advisories (quadratic runtime on duplicate
    # attribute checks, unbounded namespace-declaration allocation). Pulled
    # transitively via inferno <- pprof's optional `profiling` feature
    # (crates/ruvector-bench/Cargo.toml, flamegraph generation only, never
    # in a production binary). Blocked upstream: pprof's latest release
    # (0.15.0) still pins `inferno = "^0.11"`, and inferno 0.11.x pins
    # `quick-xml = "^0.26"` — a `cargo update` cannot cross either
    # constraint without a `[patch]` override we don't want to carry.
    # inferno only parses locally-generated profiling output produced by
    # our own bench runs; no untrusted/network-controlled XML ever reaches
    # this path. Re-evaluate when pprof bumps its inferno pin to 0.12+.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # ------------------------------------------------------------------
    # Soundness/unsoundness notices in deps we do not directly control
    # ------------------------------------------------------------------

    # NOTE: the package names on these two entries were previously swapped
    # (corrected 2026-09-04 against the advisory-db `package` field; the IDs
    # themselves were always right, only the prose was crossed).

    # pprof < 0.14 — unsound `slice::from_raw_parts` usage (RUSTSEC-2024-0408).
    # Only loaded behind benchmark/profiling features, never in production
    # binaries. Not present in the workspace Cargo.lock as of 2026-09-04.
    "RUSTSEC-2024-0408",

    # lru 0.9 – 0.16.2 — IterMut Stacked Borrows violation (RUSTSEC-2026-0002).
    # Used transitively (lru 0.12.5); we do not call IterMut from the affected
    # crate. Track parent dep upgrade. Note RUSTSEC-2026-0253 (lru < 0.18.2,
    # unsound, 2026-05-12) also matches 0.12.5 and 0.16.4 and is not ignored
    # here — it surfaces as a cargo-audit warning, which does not fail CI.
    "RUSTSEC-2026-0002",

    # rand — unsoundness when using a custom global logger with rand::rng().
    # We never install a custom logger in the rand call path. Awaiting
    # transitive upgrade across the workspace.
    "RUSTSEC-2026-0097",

    # imageproc 0.25.0 — three soundness notices (improper bounds checks in
    # image sampling). Used only in examples/scipix behind the optional
    # `preprocess` feature; not compiled into any production binary. No fixed
    # upstream release available yet. Re-evaluate on imageproc 0.26+.
    "RUSTSEC-2026-0115",
    "RUSTSEC-2026-0116",
    "RUSTSEC-2026-0117",
]
