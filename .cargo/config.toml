[net]
git-fetch-with-cli = true

[registries.crates-io]
protocol = "git"

# `ruvector-filter` used to carry `#![recursion_limit = "4096"]` (PR #389)
# to survive trait-resolution overflow when serde_json's `Serializer` blanket
# impl recursed through its internally tagged, self-referential newtype
# variants; that overflow is gone since the logical operators became struct
# variants, and the limit attribute with it. The larger thread stack it
# needed is kept for now: other crates may have come to rely on it, and
# removing it is a separate, measurable change.
[env]
RUST_MIN_STACK = "16777216"

# aarch64 cross-build linker for Pi 5 deployments (ADR-179, iter 2).
# Mirrors the per-crate config in crates/ruvector-hailo-cluster/.cargo/config.toml
# but at workspace scope so any crate (ruvllm-cli, etc.) picks it up.
# Default linker (mold) is host-bound and rejects arm64 objects.
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
# Cortex-A76 (Pi 5) tuning, same flags as iter-84 hailo-cluster ultra profile.
rustflags = [
    "-C", "target-cpu=cortex-a76",
    "-C", "target-feature=+lse,+rcpc,+fp16,+crc",
]
